<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Jaboz</title>
  <meta name="description" content="Jaboz — studio phần mềm nhỏ, làm sản phẩm dùng hàng ngày." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1412;
      --moss: #1c2e28;
      --foam: #e7efe8;
      --mist: #a8b9b0;
      --copper: #d08a4a;
      --copper-deep: #a8652e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--foam);
      background: var(--ink);
      overflow: hidden;
    }
    .stage {
      position: relative;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      isolation: isolate;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 15% 20%, rgba(208, 138, 74, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(40, 90, 72, 0.45), transparent 50%),
        linear-gradient(165deg, #121a17 0%, var(--ink) 45%, #0a100e 100%);
      z-index: -2;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: -1;
    }
    .orb {
      position: absolute;
      width: min(52vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(208, 138, 74, 0.35), transparent 62%);
      filter: blur(8px);
      animation: drift 14s ease-in-out infinite alternate;
      z-index: -1;
      right: 8%;
      top: 18%;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-4%, 6%) scale(1.08); }
    }
    .panel {
      width: min(40rem, 100%);
      text-align: left;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: clamp(3.4rem, 12vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--foam);
    }
    .brand span {
      color: var(--copper);
    }
    .line {
      margin-top: 1.35rem;
      max-width: 28ch;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-weight: 400;
      line-height: 1.45;
      color: var(--mist);
      animation: rise 1s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .rule {
      margin-top: 2rem;
      width: 3.5rem;
      height: 2px;
      background: linear-gradient(90deg, var(--copper), transparent);
      animation: rise 1s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .meta {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--mist) 80%, transparent);
      animation: rise 1s 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    footer {
      position: absolute;
      left: clamp(1.5rem, 4vw, 3rem);
      bottom: clamp(1.2rem, 3vw, 2rem);
      font-size: 0.75rem;
      color: color-mix(in srgb, var(--mist) 55%, transparent);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="orb" aria-hidden="true"></div>
    <div class="panel">
      <h1 class="brand">Ja<span>boz</span></h1>
      <p class="line">Studio nhỏ. Phần mềm gọn. Làm những thứ dùng mỗi ngày.</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="meta">Seoul · 2026</p>
    </div>
    <footer>© Jaboz</footer>
  </div>
</body>
</html>
