<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Jaboz — Cửa hàng APK</title>
  <meta name="description" content="Cửa hàng APK chính thức của Jaboz." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #e84393;
      --yellow: #f5c518;
      --yellow-deep: #c98900;
      --purple: #7c3aed;
      --purple-deep: #5b21b6;
      --ink: #202124;
      --body: #5f6368;
      --muted: #80868b;
      --line: #eee3ef;
      --bg: #fff;
      --soft: #fff7fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: only light; }
    body {
      font-family: Roboto, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: none; }

    .top {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--purple);
      color: #fff;
    }
    .top .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      color: #fff;
      -webkit-text-fill-color: #fff;
    }
    .top .icon-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      color: #fff;
      font-size: 1.2rem;
    }

    main { width: min(720px, 100%); margin: 0 auto; padding-bottom: 40px; }

    .banner {
      margin: 12px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      min-height: 180px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      display: none;
    }
    .banner.show { display: block; }
    .banner-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: brightness(0.55);
    }
    .banner-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.55);
    }
    .banner-bar img {
      width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: #fff;
    }
    .banner-bar .title { flex: 1; font-weight: 700; color: #fff; -webkit-text-fill-color: #fff; }
    .btn-dl, .btn-open {
      color: #fff; -webkit-text-fill-color: #fff;
      font-weight: 700; font-size: 0.86rem;
      padding: 8px 14px; border-radius: 8px;
      white-space: nowrap;
    }
    .btn-dl { background: linear-gradient(90deg, var(--pink), var(--purple)); }
    .btn-open { background: var(--purple); }
    .btn-dl:disabled, .btn-open:disabled { opacity: 0.45; cursor: default; }

    .cats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px 10px 4px;
      text-align: center;
    }
    .cat span {
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center; margin: 0 auto 6px;
      color: #fff; -webkit-text-fill-color: #fff; font-size: 1.2rem; font-weight: 700;
    }
    .cat p { font-size: 0.78rem; color: var(--ink); }
    .c1 span { background: #f5a623; }
    .c2 span { background: var(--pink); }
    .c3 span { background: var(--purple); }
    .c4 span { background: linear-gradient(135deg, var(--pink), var(--purple)); }

    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 14px 8px;
      font-size: 1.1rem; font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 8px;
      padding: 4px 12px 20px;
    }
    .tile {
      text-align: center;
      color: inherit;
    }
    .tile img, .tile .fallback {
      width: 72px; height: 72px;
      border-radius: 16px;
      object-fit: cover;
      margin: 0 auto 6px;
      display: block;
      background: linear-gradient(145deg, var(--pink), var(--yellow-deep), var(--purple));
      box-shadow: 0 2px 8px rgba(124,58,237,0.12);
    }
    .tile .fallback {
      color: #fff; -webkit-text-fill-color: #fff;
      display: grid; place-items: center; font-size: 1.6rem; font-weight: 700;
    }
    .tile .name {
      font-size: 0.75rem; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; min-height: 2.5em;
    }
    .tile .status {
      margin-top: 2px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--pink);
      min-height: 1em;
    }

    .empty {
      margin: 20px 14px; padding: 24px; text-align: center;
      color: var(--muted); border: 1px dashed var(--line); border-radius: 14px;
    }

    .toast {
      position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
      z-index: 80; max-width: min(90vw, 420px);
      background: rgba(32,33,36,0.92); color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 0.86rem;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }

    /* Detail sheet */
    .sheet {
      position: fixed; inset: 0; z-index: 60;
      background: #fff; display: none; flex-direction: column;
    }
    .sheet.open { display: flex; }
    .sheet-top {
      height: 52px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; background: var(--purple); color: #fff;
    }
    .sheet-top button, .sheet-top .title {
      color: #fff; -webkit-text-fill-color: #fff; font-weight: 700;
    }
    .sheet-top .title { flex: 1; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-body { flex: 1; overflow: auto; padding: 16px 16px 110px; width: min(720px, 100%); margin: 0 auto; }
    .detail-head { display: flex; gap: 14px; align-items: center; }
    .detail-head img, .detail-head .fallback {
      width: 84px; height: 84px; border-radius: 20px; object-fit: cover;
      background: linear-gradient(145deg, var(--pink), var(--purple));
      color: #fff; display: grid; place-items: center; font-size: 2rem; font-weight: 700;
    }
    .detail-head h1 { font-size: 1.35rem; letter-spacing: -0.02em; }
    .detail-head .dev { color: var(--purple); font-weight: 700; margin-top: 4px; }
    .detail-head .sum { color: var(--body); font-size: 0.9rem; margin-top: 6px; line-height: 1.4; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .stat {
      background: rgba(232,67,147,0.12); color: var(--pink);
      font-size: 0.78rem; font-weight: 700; padding: 5px 10px; border-radius: 999px;
    }
    .block { margin-top: 22px; }
    .block h2 { font-size: 1.05rem; margin-bottom: 8px; }
    .block p, .block li { color: var(--body); line-height: 1.55; font-size: 0.94rem; }
    .block ul { padding-left: 1.1rem; }
    .guide { color: var(--body); line-height: 1.6; font-size: 0.95rem; }
    .guide ol { padding-left: 1.2rem; margin: 8px 0 0; }
    .guide li { margin: 8px 0; }
    .guide b { color: var(--ink); }
    .row {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem;
    }
    .row span { color: var(--muted); }
    .sheet-foot {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid var(--line);
    }
    .foot-actions {
      display: flex; gap: 10px; width: min(720px, 100%); margin: 0 auto;
    }
    .foot-actions .btn-dl,
    .foot-actions .btn-open {
      flex: 1; text-align: center; padding: 14px; border-radius: 10px; font-size: 0.95rem;
    }
    .foot-actions .btn-open[hidden],
    .foot-actions .btn-dl[hidden] { display: none !important; }
    .btn-confirm {
      display: block; width: min(720px, 100%); margin: 8px auto 0;
      text-align: center; padding: 10px; border-radius: 10px;
      font-size: 0.86rem; font-weight: 700; color: var(--purple);
      background: rgba(124,58,237,0.08);
    }
    .btn-confirm[hidden] { display: none !important; }

    footer {
      width: min(720px, 100%); margin: 0 auto; padding: 8px 14px 24px;
      color: var(--muted); font-size: 0.8rem;
      display: flex; justify-content: space-between;
    }

    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .banner { min-height: 220px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="icon-btn" aria-hidden="true">☰</span>
    <a class="brand" href="./">Jaboz</a>
    <span class="icon-btn" aria-hidden="true">⌕</span>
  </header>

  <main>
    <div class="banner" id="banner">
      <div class="banner-bg" id="bannerBg"></div>
      <div class="banner-bar">
        <img id="bannerIcon" alt="" />
        <div class="title" id="bannerTitle"></div>
        <button class="btn-dl" type="button" id="bannerDl">Tải về</button>
      </div>
    </div>

    <div class="cats">
      <div class="cat c1"><span>▶</span><p>Trò chơi</p></div>
      <div class="cat c2"><span>▣</span><p>Ứng dụng</p></div>
      <div class="cat c3"><span>💬</span><p>Tin tức</p></div>
      <div class="cat c4"><span>J</span><p>Cửa hàng</p></div>
    </div>

    <div class="section-head"><span>Phát hiện</span><span>›</span></div>
    <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">Đang tải…</div></div>
  </main>

  <footer>
    <span>© 2026 Jaboz</span>
    <span>jaboz.com</span>
  </footer>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-top">
      <button type="button" id="sheetBack">←</button>
      <div class="title" id="sheetTitle">Chi tiết</div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <div class="foot-actions">
        <button class="btn-dl" type="button" id="sheetDl">Tải về</button>
        <button class="btn-open" type="button" id="sheetOpen" hidden>Mở app</button>
      </div>
      <button class="btn-confirm" type="button" id="sheetConfirm" hidden>Đã cài xong — hiện Mở app</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const grid = document.getElementById("grid");
    const sheet = document.getElementById("sheet");
    const sheetBody = document.getElementById("sheetBody");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetDl = document.getElementById("sheetDl");
    const sheetOpen = document.getElementById("sheetOpen");
    const sheetConfirm = document.getElementById("sheetConfirm");
    const bannerDl = document.getElementById("bannerDl");
    const toastEl = document.getElementById("toast");
    let current = null;
    let appsCache = [];
    let featuredApp = null;
    const installedPackages = new Set();
    let toastTimer = 0;

    // Xóa cờ "đã cài" cũ (trước đây bị gắn nhầm khi mới bấm Mở app).
    try {
      Object.keys(localStorage).forEach((k) => {
        if (k.startsWith("jaboz:installed:")) localStorage.removeItem(k);
      });
    } catch (_) {}

    function letter(name) {
      return (name || "J").trim().charAt(0).toUpperCase();
    }

    function isAndroid() {
      return /Android/i.test(navigator.userAgent || "");
    }

    function versionKey(app) {
      return String(app.latestVersionCode || app.latestVersionName || "0");
    }

    function appKey(app) {
      return app.id || app.packageName || app.name || "";
    }

    function dlKey(app) {
      return "jaboz:dl:" + appKey(app) + ":" + versionKey(app);
    }

    function installStartedKey(app) {
      return "jaboz:install-started:" + appKey(app) + ":" + versionKey(app);
    }

    function confirmedKey(app) {
      return "jaboz:installed-ok:" + appKey(app);
    }

    function markDownloaded(app) {
      try { localStorage.setItem(dlKey(app), "1"); } catch (_) {}
    }

    function markInstallStarted(app) {
      try { sessionStorage.setItem(installStartedKey(app), "1"); } catch (_) {}
    }

    function markInstalledConfirmed(app) {
      if (app.packageName) installedPackages.add(app.packageName);
      try { localStorage.setItem(confirmedKey(app), "1"); } catch (_) {}
    }

    function wasDownloaded(app) {
      try { return localStorage.getItem(dlKey(app)) === "1"; } catch (_) { return false; }
    }

    function wasInstallStarted(app) {
      try { return sessionStorage.getItem(installStartedKey(app)) === "1"; } catch (_) { return false; }
    }

    function isInstalled(app) {
      if (app.packageName && installedPackages.has(app.packageName)) return true;
      try { return localStorage.getItem(confirmedKey(app)) === "1"; } catch (_) { return false; }
    }

    // Chỉ "open" khi đã cài (xác nhận hoặc hệ thống báo). Tải xong chỉ hiện Cài đặt.
    function actionFor(app) {
      if (isInstalled(app)) return "open";
      if (wasDownloaded(app)) return "install";
      if (!app.apkUrl) return "none";
      return "download";
    }

    function labelFor(action) {
      if (action === "open") return "Mở app";
      if (action === "install") return "Cài đặt";
      if (action === "none") return "Chưa có bản tải";
      return "Tải về";
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2800);
    }

    function downloadApk(app) {
      if (!app.apkUrl) return;
      const a = document.createElement("a");
      a.href = app.apkUrl;
      a.rel = "noopener";
      try {
        const name = decodeURIComponent(new URL(app.apkUrl, location.href).pathname.split("/").pop() || "");
        if (name) a.setAttribute("download", name);
      } catch (_) {}
      document.body.appendChild(a);
      a.click();
      a.remove();
      markDownloaded(app);
      showToast("Đã bắt đầu tải — bấm Cài đặt sau khi tải xong. Chưa cài thì chưa có Mở app.");
      refreshActions();
    }

    function installApk(app) {
      if (!app.apkUrl) return;
      markDownloaded(app);
      markInstallStarted(app);
      showToast("Đang mở trình cài đặt. Cài xong hãy bấm “Đã cài xong — hiện Mở app”.");
      refreshActions();
      window.location.href = app.apkUrl;
    }

    function openApp(app) {
      if (!isInstalled(app)) {
        showToast("App chưa cài — hãy bấm Cài đặt trước.");
        return;
      }
      if (!app.packageName) {
        showToast("App này chưa có package để mở.");
        return;
      }
      if (!isAndroid()) {
        showToast("Mở app chỉ dùng được trên điện thoại Android.");
        return;
      }
      const fallback = encodeURIComponent(location.href.split("#")[0] + "#app");
      location.href =
        "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=" +
        encodeURIComponent(app.packageName) +
        ";S.browser_fallback_url=" + fallback + ";end";
    }

    function runPrimary(app) {
      const action = actionFor(app);
      if (action === "open") openApp(app);
      else if (action === "install") installApk(app);
      else if (action === "download") downloadApk(app);
    }

    function bindSheetActions(app) {
      const action = actionFor(app);

      if (action === "open") {
        sheetDl.hidden = true;
        sheetOpen.hidden = false;
        sheetOpen.disabled = false;
        sheetOpen.textContent = "Mở app";
        sheetConfirm.hidden = true;
      } else {
        sheetDl.hidden = false;
        sheetDl.disabled = action === "none";
        sheetDl.textContent = labelFor(action);
        // Chưa cài thì không hiện Mở app.
        sheetOpen.hidden = true;
        // Chỉ hiện nút xác nhận sau khi đã bấm Cài đặt trong phiên này.
        sheetConfirm.hidden = !(action === "install" && wasInstallStarted(app));
      }

      sheetDl.onclick = () => runPrimary(app);
      sheetOpen.onclick = () => openApp(app);
      sheetConfirm.onclick = () => {
        markInstalledConfirmed(app);
        showToast("Đã bật Mở app.");
        refreshActions();
      };
    }

    function bindBannerAction() {
      if (!featuredApp) return;
      const action = actionFor(featuredApp);
      bannerDl.textContent = labelFor(action === "none" ? "download" : action);
      bannerDl.disabled = action === "none";
      bannerDl.onclick = (e) => {
        e.stopPropagation();
        runPrimary(featuredApp);
      };
    }

    function refreshActions() {
      if (current) bindSheetActions(current);
      bindBannerAction();
      paintGridStatuses();
    }

    function paintGridStatuses() {
      grid.querySelectorAll(".tile").forEach((tile) => {
        const id = tile.dataset.id || "";
        const app = appsCache.find((a) => (a.id || "") === id);
        const status = tile.querySelector(".status");
        if (!status || !app) return;
        const action = actionFor(app);
        status.textContent = action === "open" || action === "install" ? labelFor(action) : "";
      });
    }

    function openDetail(app) {
      current = app;
      sheetTitle.textContent = app.name || "Chi tiết";
      const iconHtml = app.icon
        ? `<img src="${app.icon}" alt="">`
        : `<div class="fallback">${letter(app.name)}</div>`;
      const stats = [
        app.latestVersionName && ("v" + app.latestVersionName),
        app.sizeLabel,
        app.updated,
        app.requires
      ].filter(Boolean).map((t) => `<span class="stat">${t}</span>`).join("");
      const details = (app.details || []).map((d) => `<li>${d}</li>`).join("");
      const notes = app.releaseNotes
        ? `<div class="block"><h2>Có gì mới</h2><p>${app.releaseNotes}</p></div>`
        : "";
      const installGuide = app.installGuide
        ? `<div class="block"><h2>Hướng dẫn cài đặt (làm lần đầu)</h2><div class="guide">${app.installGuide}</div></div>`
        : `<div class="block"><h2>Cách cài</h2><p>1. Bấm <b>Tải về</b>.<br>2. Tải xong bấm <b>Cài đặt</b> (chưa cài thì chưa có nút Mở app).<br>3. Cài xong bấm <b>Đã cài xong — hiện Mở app</b>, rồi bấm <b>Mở app</b>.</p></div>`;
      sheetBody.innerHTML = `
        <div class="detail-head">
          ${iconHtml}
          <div>
            <h1>${app.name || ""}</h1>
            <div class="dev">${app.developer || "Jaboz"}</div>
            <div class="sum">${app.summary || ""}</div>
          </div>
        </div>
        <div class="stats">${stats}</div>
        ${installGuide}
        <div class="block">
          <h2>Giới thiệu</h2>
          <p>${app.description || app.summary || ""}</p>
          ${details ? `<ul>${details}</ul>` : ""}
        </div>
        ${notes}
        <div class="block">
          <h2>Thông tin</h2>
          ${[
            ["Nhà phát triển", app.developer || "Jaboz"],
            ["Phiên bản", app.latestVersionName],
            ["Dung lượng", app.sizeLabel],
            ["Cập nhật", app.updated],
            ["Yêu cầu", app.requires]
          ].filter(([, v]) => v).map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join("")}
        </div>`;
      bindSheetActions(app);
      sheet.classList.add("open");
      document.body.style.overflow = "hidden";
      if (!history.state || !history.state.jabozDetail) {
        history.pushState({ jabozDetail: true, id: app.id || "" }, "", "#app");
      } else {
        history.replaceState({ jabozDetail: true, id: app.id || "" }, "", "#app");
      }
    }

    function closeDetail(fromPopState) {
      if (!sheet.classList.contains("open")) return;
      sheet.classList.remove("open");
      document.body.style.overflow = "";
      current = null;
      if (!fromPopState && history.state && history.state.jabozDetail) {
        history.back();
      }
    }

    document.getElementById("sheetBack").onclick = () => closeDetail(false);
    window.addEventListener("popstate", () => {
      if (sheet.classList.contains("open")) closeDetail(true);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && sheet.classList.contains("open")) closeDetail(false);
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshActions();
    });

    async function detectInstalledRelatedApps() {
      if (!navigator.getInstalledRelatedApps) return;
      try {
        const list = await navigator.getInstalledRelatedApps();
        list.forEach((item) => {
          if (item.id) installedPackages.add(item.id);
        });
      } catch (_) {}
    }

    function paint(apps) {
      appsCache = apps.slice().sort((a, b) => {
        const rank = (app) => (app.id === "jaboz-manager" ? 0 : 1);
        return rank(a) - rank(b) || Number(!!b.pinned) - Number(!!a.pinned);
      });
      featuredApp = appsCache.find((a) => a.id === "jaboz-manager") || appsCache.find((a) => a.pinned) || appsCache[0];
      const banner = document.getElementById("banner");
      if (featuredApp) {
        banner.classList.add("show");
        document.getElementById("bannerTitle").textContent = featuredApp.name || "";
        const icon = document.getElementById("bannerIcon");
        if (featuredApp.icon) {
          icon.src = featuredApp.icon;
          document.getElementById("bannerBg").style.backgroundImage = `url(${featuredApp.icon})`;
        }
        bindBannerAction();
        banner.onclick = () => openDetail(featuredApp);
      }

      grid.textContent = "";
      if (!appsCache.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Chưa có app nào.</div>`;
        return;
      }
      appsCache.forEach((app) => {
        const a = document.createElement("button");
        a.type = "button";
        a.className = "tile";
        a.dataset.id = app.id || "";
        const action = actionFor(app);
        a.innerHTML = (app.icon
          ? `<img src="${app.icon}" alt=""><div class="name"></div><div class="status"></div>`
          : `<div class="fallback">${letter(app.name)}</div><div class="name"></div><div class="status"></div>`);
        a.querySelector(".name").textContent = app.name || "";
        a.querySelector(".status").textContent =
          action === "open" || action === "install" ? labelFor(action) : "";
        a.onclick = () => openDetail(app);
        grid.append(a);
      });
    }

    Promise.all([
      fetch("./apps.json", { cache: "no-store" }).then((res) => {
        if (!res.ok) throw new Error("fetch");
        return res.json();
      }),
      detectInstalledRelatedApps()
    ])
      .then(([data]) => paint(data.apps || []))
      .catch(() => {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">Không tải được danh sách.</div>`;
      });
  </script>
</body>
</html>
