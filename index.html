<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Jaboz — Cửa hàng APK</title>
  <meta name="description" content="Tải app chính thức của Jaboz. Jaboz Manager được ghim đầu trang." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #e84393;
      --pink-dark: #c2256e;
      --yellow: #f5c518;
      --yellow-deep: #c98900;
      --purple: #7c3aed;
      --purple-deep: #5b21b6;
      --ink: #2a2033;
      --body: #4a3d55;
      --muted: #7a6b86;
      --line: #f0dce8;
      --bg: #fff7fb;
      --card: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: only light; }
    body {
      font-family: Roboto, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 55% 40% at 0% 0%, rgba(232, 67, 147, 0.22), transparent 60%),
        radial-gradient(ellipse 45% 35% at 100% 0%, rgba(124, 58, 237, 0.2), transparent 55%),
        radial-gradient(ellipse 40% 30% at 80% 100%, rgba(245, 197, 24, 0.28), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    a { color: var(--purple); text-decoration: none; }
    button { font: inherit; }

    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      background-image: linear-gradient(#fff, #fff), linear-gradient(90deg, var(--pink), var(--yellow), var(--purple));
      background-size: 100% calc(100% - 3px), 100% 3px;
      background-position: top, bottom;
      background-repeat: no-repeat;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
    }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      -webkit-text-fill-color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .top-note {
      color: #fff;
      -webkit-text-fill-color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      background: var(--yellow-deep);
      padding: 6px 12px;
      border-radius: 999px;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 24px auto 48px;
    }
    .intro {
      margin-bottom: 18px;
    }
    .intro h1 {
      font-size: clamp(1.6rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .intro p {
      margin-top: 6px;
      color: var(--body);
      line-height: 1.5;
    }

    .list { display: grid; gap: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.06);
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 16px;
      align-items: start;
    }
    .card.pinned {
      border-color: rgba(232, 67, 147, 0.45);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.12);
      background:
        linear-gradient(135deg, rgba(232,67,147,0.08), rgba(124,58,237,0.06)),
        #fff;
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: linear-gradient(145deg, var(--pink) 0%, var(--yellow-deep) 48%, var(--purple) 100%);
      color: #fff;
      -webkit-text-fill-color: #fff;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      font-weight: 700;
      overflow: hidden;
      flex: none;
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    .meta-top {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }
    .name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pin {
      color: #fff;
      -webkit-text-fill-color: #fff;
      background: var(--pink);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .dev { color: var(--purple); font-weight: 700; font-size: 0.92rem; }
    .summary {
      margin-top: 6px;
      color: var(--body);
      font-size: 0.94rem;
      line-height: 1.45;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .stat {
      background: rgba(124, 58, 237, 0.08);
      color: var(--purple-deep);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
    }
    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .install {
      appearance: none;
      border: 0;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      color: #fff;
      -webkit-text-fill-color: #fff;
      min-width: 160px;
      height: 42px;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .install:hover { filter: brightness(0.96); }
    .install:disabled {
      background: #e8eaed;
      color: #80868b;
      -webkit-text-fill-color: #80868b;
      cursor: default;
    }
    .ghost {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .details {
      margin-top: 10px;
      padding-left: 1.1rem;
      color: var(--body);
      font-size: 0.9rem;
      line-height: 1.55;
      display: none;
    }
    .details.open { display: block; }
    .empty, .loading {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    footer {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .card { grid-template-columns: 68px 1fr; padding: 14px; gap: 12px; }
      .icon { width: 68px; height: 68px; border-radius: 16px; font-size: 1.8rem; }
      .install { width: 100%; }
      .top-note { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="logo" href="./">
      <span class="mark">J</span>
      Jaboz
    </a>
    <span class="top-note">Cửa hàng APK</span>
  </header>

  <main>
    <div class="intro">
      <h1>Cửa hàng Jaboz</h1>
      <p>Tải app chính thức. <strong>Jaboz Manager</strong> được ghim đầu trang — cài một lần, mở mọi app Jaboz sau này không cần vào web.</p>
    </div>
    <div class="list" id="list">
      <div class="loading">Đang tải danh sách…</div>
    </div>
  </main>

  <footer>
    <span>© 2026 Jaboz</span>
    <span>jaboz.com</span>
  </footer>

  <script>
    const list = document.getElementById("list");

    function letter(name) {
      return (name || "J").trim().charAt(0).toUpperCase();
    }

    function card(app) {
      const el = document.createElement("article");
      el.className = "card" + (app.pinned ? " pinned" : "");
      el.id = app.id || "";

      const icon = document.createElement("div");
      icon.className = "icon";
      if (app.icon) {
        const img = document.createElement("img");
        img.src = app.icon;
        img.alt = "";
        icon.append(img);
      } else {
        icon.textContent = letter(app.name);
      }

      const body = document.createElement("div");
      const top = document.createElement("div");
      top.className = "meta-top";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = app.name || "App";
      top.append(name);
      if (app.pinned) {
        const pin = document.createElement("span");
        pin.className = "pin";
        pin.textContent = "Ghim";
        top.append(pin);
      }

      const dev = document.createElement("div");
      dev.className = "dev";
      dev.textContent = app.developer || "Jaboz";

      const summary = document.createElement("p");
      summary.className = "summary";
      summary.textContent = app.summary || app.description || "";

      const stats = document.createElement("div");
      stats.className = "stats";
      [
        app.latestVersionName && ("v" + app.latestVersionName),
        app.sizeLabel,
        app.updated,
        app.requires
      ].filter(Boolean).forEach((t) => {
        const s = document.createElement("span");
        s.className = "stat";
        s.textContent = t;
        stats.append(s);
      });

      const actions = document.createElement("div");
      actions.className = "actions";
      const download = document.createElement("button");
      download.className = "install";
      download.type = "button";
      if (app.apkUrl) {
        download.textContent = "Tải APK";
        download.onclick = () => { window.location.href = app.apkUrl; };
      } else {
        download.textContent = "Chưa có bản tải";
        download.disabled = true;
      }
      actions.append(download);

      const detailsList = (app.details || []).concat(app.releaseNotes ? [app.releaseNotes] : []);
      if (detailsList.length) {
        const more = document.createElement("button");
        more.className = "ghost";
        more.type = "button";
        more.textContent = "Chi tiết";
        const ul = document.createElement("ul");
        ul.className = "details";
        detailsList.forEach((d) => {
          const li = document.createElement("li");
          li.textContent = d;
          ul.append(li);
        });
        more.onclick = () => {
          ul.classList.toggle("open");
          more.textContent = ul.classList.contains("open") ? "Thu gọn" : "Chi tiết";
        };
        actions.append(more);
        body.append(top, dev, summary, stats, actions, ul);
      } else {
        body.append(top, dev, summary, stats, actions);
      }

      el.append(icon, body);
      return el;
    }

    function paint(apps) {
      list.textContent = "";
      if (!apps.length) {
        list.innerHTML = `<div class="empty">Chưa có app nào.</div>`;
        return;
      }
      const sorted = apps.slice().sort((a, b) => Number(!!b.pinned) - Number(!!a.pinned));
      sorted.forEach((app) => list.append(card(app)));
    }

    fetch("./apps.json", { cache: "no-store" })
      .then((res) => { if (!res.ok) throw new Error("fetch"); return res.json(); })
      .then((data) => paint(data.apps || []))
      .catch(() => {
        list.innerHTML = `<div class="empty">Không tải được danh sách. Thử tải lại trang.</div>`;
      });
  </script>
</body>
</html>
